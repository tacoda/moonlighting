# moonlighting user config
# Default location: ~/.config/moonlighting/config.toml
# Move it with MOONLIGHTING_CONFIG. One file per user, per machine.
# Precedence: command flags beat env vars beat this file.

[factory]
engine = "pi"            # pi, claude or opencode
model = ""               # optional, engine-specific syntax, passed verbatim
qa-model = ""            # optional, empty means the order model
orders-dir = ""          # optional, empty means <data dir>/orders
                         # (~/.local/share/moonlighting/orders)

# Profiles hold one identity each. Bind a profile to a repo from the
# [repo.NAME] sections. Every key is optional: leave out what you do not
# need. gh-account must exist in `gh auth status`.

[profile.personal]
name = "Your Name"
email = "you@example.com"
gh-account = "your-github-user"
ssh-key = ""                        # e.g. "~/.ssh/id_ed25519"

[profile.work]
name = "Your Work Name"
email = "you@work.example"
gh-account = "your-work-github-user"
ssh-key = "~/.ssh/id_work"

# Bind repos by the name an order writes in its repo: field.
# The path may be absolute, "~/...", or relative to the factory root.
# Any profile name works: add as many [profile.X] sections as you need.

[repo.site]
path = "~/code/site"
profile = "personal"

[repo.api]
path = "~/code/api"
profile = "work"

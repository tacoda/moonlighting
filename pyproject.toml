[project]
name = "moonlighting-factory"
version = "0.1.1"
description = "A software factory: people decide by day, agents type by night."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "tacoda" }]
keywords = ["ai-agents", "automation", "workflow", "factory", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
moonlighting = "moonlighting.cli:main"

[project.urls]
Repository = "https://github.com/tacoda/moonlighting"
Issues = "https://github.com/tacoda/moonlighting/issues"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonlighting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["moonlighting"]

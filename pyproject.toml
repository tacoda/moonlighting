[project]
name = "moonlighting"
version = "0.1.0"
description = "A software factory: people decide by day, agents type by night."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
moonlighting = "moonlighting.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonlighting"]

[tool.ruff.lint.isort]
known-first-party = ["moonlighting"]
